<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Skeewiff</title>
	<meta name="author" content="Skeewiff">
	<meta name="description" content="Skeewiff – Something Like That? Out now on Jalapeno Records.">
	<link rel="icon" href="favicon.ico" sizes="48x48">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<link rel="me" href="https://mastodon.social/@Skeewiff">

	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 24px;
			padding: 40px 16px;
			/* 40% black tint over the artwork, as on the original site */
			background:
				linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
				#11417c url(assets/img/bg.jpg) center top / cover no-repeat;
			font-family: Arial, sans-serif;
		}

		body > * {
			max-width: 100%;
		}

		img {
			display: block;
			max-width: 100%;
			height: auto;
		}

		.cover {
			width: 367px;
		}

		.links {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.links ul {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			list-style: none;
		}

		.links a {
			position: relative;
			display: inline-block;
			margin: 8px;
			color: #fff;
			font-size: 11px;
			letter-spacing: 1px;
			line-height: 1.5;
			text-decoration: none;
			text-transform: uppercase;
			text-shadow: 0 0 1px rgba(255, 255, 255, 0.3);
		}

		/* Dot trio that fades in under a link on hover */
		.links a::before {
			content: "•";
			position: absolute;
			top: 100%;
			left: 50%;
			transform: translateX(-50%);
			color: transparent;
			text-shadow: 0 0 transparent;
			transition: color 0.3s, text-shadow 0.3s;
			pointer-events: none;
		}

		.links a:hover::before,
		.links a:focus-visible::before {
			color: #fff;
			text-shadow: 10px 0 #fff, -10px 0 #fff;
		}

		.links a:focus-visible {
			outline: 1px solid #fff;
			outline-offset: 3px;
		}

		.radio {
			width: 145px;
		}
	</style>
</head>
<body>

	<a href="https://skeewiff.lnk.to/SomethingLikeThat" target="_blank" rel="noopener">
		<img class="cover" src="assets/img/cover.png" width="367" height="398" alt="Skeewiff – Something Like That? Listen here">
	</a>

	<nav class="links" aria-label="Skeewiff elsewhere">
		<ul>
			<li><a href="https://open.spotify.com/artist/3xL2Wrd5tv4QDsWCdl81au" target="_blank" rel="noopener">Spotify</a></li>
			<li><a href="https://skeewiff.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a></li>
			<li><a href="https://music.apple.com/gb/artist/skeewiff/15190894" target="_blank" rel="noopener">Apple</a></li>
			<li><a href="https://www.youtube.com/@skeewifftube" target="_blank" rel="noopener">Youtube</a></li>
		</ul>
		<ul>
			<li><a href="https://www.facebook.com/skeewiff.music" target="_blank" rel="noopener">Facebook</a></li>
			<li><a href="https://www.instagram.com/alex_skeewiff" target="_blank" rel="noopener">Instagram</a></li>
			<li><a href="https://www.tiktok.com/@skeewiff" target="_blank" rel="noopener">Tik Tok</a></li>
			<li><a href="https://bsky.app/profile/skeewiff.bsky.social" target="_blank" rel="noopener">Bluesky</a></li>
		</ul>
		<ul>
			<li><a href="https://www.jalapenorecords.com" target="_blank" rel="noopener">Jalapeno Records</a></li>
			<li><a href="https://www.universalproductionmusic.com/en-gb/discover/labels/271/pedigree-cuts" target="_blank" rel="noopener">Pedigree Cuts</a></li>
		</ul>
	</nav>

	<a href="https://radio.pedigreecuts.i234.me/public/skeewiff" target="_blank" rel="noopener">
		<img class="radio" src="assets/img/SRADIO.png" width="145" height="145" alt="Skeewiff Radio 24/7">
	</a>

</body>
</html>
